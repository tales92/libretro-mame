    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#45DDF2"/><stop offset="1" stop-color="#78F0D0"/></linearGradient>
  </defs>
  <rect width="1200" height="360" rx="30" fill="url(#bg)"/>
  <g transform="translate(72 75)">
