name: Arrange Audio - FFS Diagnostic Build

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-diagnostic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          submodules: recursive
          fetch-depth: 0

      - name: Install MinGW cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mingw-w64 \
            gcc-mingw-w64-x86-64-posix \
            g++-mingw-w64-x86-64-posix \
            binutils-mingw-w64-x86-64 \
            lld

      - name: Apply and validate FFS audio diagnostic changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ------------------------------------------------------------
          # Arrange Audio diagnostic instrumentation
          # ------------------------------------------------------------
          neogeo = Path("src/mame/snk/neogeo.cpp")
          text = neogeo.read_text(encoding="utf-8")

          marker = "#define LOG_VIDEO_SYSTEM         (1U << 1)\n"
          if "#define ARRANGE_AUDIO_DIAGNOSTIC 0" not in text:
              if marker not in text:
                  raise SystemExit("Could not locate LOG_VIDEO_SYSTEM marker")
              insertion = (
                  marker
                  + "\n"
                  + "#ifndef ARRANGE_AUDIO_DIAGNOSTIC\n"
                  + "#define ARRANGE_AUDIO_DIAGNOSTIC 0\n"
                  + "#endif\n"
              )
              text = text.replace(marker, insertion, 1)

          old = (
              "void neogeo_base_state::audio_command_w(uint8_t data)\n"
              "{\n"
          )
          new = (
              "void neogeo_base_state::audio_command_w(uint8_t data)\n"
              "{\n"
              "#if ARRANGE_AUDIO_DIAGNOSTIC\n"
              "\tlogerror(\"[ARRANGE-AUDIO] game=%s cmd=%02x pc=%06x time=%s\\n\",\n"
              "\t\tmachine().system().name,\n"
              "\t\tdata,\n"
              "\t\tunsigned(m_maincpu->pc()),\n"
              "\t\tmachine().time().to_string().c_str());\n"
              "#endif\n"
              "\n"
          )

          if "[ARRANGE-AUDIO] game=%s" not in text:
              if old not in text:
                  raise SystemExit("Could not locate audio_command_w target")
              text = text.replace(old, new, 1)

          neogeo.write_text(text, encoding="utf-8")

          # ------------------------------------------------------------
          # Libretro/Windows input fix for the diagnostic build
          #
          # retroprefix.h intentionally defines SDLMAME_WIN32 for the
          # Windows Libretro target. In MAME 0.289, input_common.cpp/.h
          # interpret that macro as a request to include SDL2 headers.
          # The Libretro input module does not use the SDL input table;
          # it uses the RetroArch input path instead. Keep the Windows
          # scan-code support, but do not request the SDL scancode field
          # for RETROMAME builds.
          # ------------------------------------------------------------
          for filename in (
              "src/osd/modules/input/input_common.cpp",
              "src/osd/modules/input/input_common.h",
          ):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              old_cond = "#if defined(OSD_SDL) || defined(SDLMAME_WIN32)"
              new_cond = "#if defined(OSD_SDL) || (defined(SDLMAME_WIN32) && !defined(RETROMAME))"

              if old_cond not in text:
                  if new_cond not in text:
                      raise SystemExit(f"Could not locate SDL condition in {filename}")
              else:
                  text = text.replace(old_cond, new_cond, 1)

              path.write_text(text, encoding="utf-8")

          # Hard validation: the Windows Libretro build must no longer
          # include the SDL2 header from input_common.cpp.
          cpp = Path("src/osd/modules/input/input_common.cpp").read_text(encoding="utf-8")
          hdr = Path("src/osd/modules/input/input_common.h").read_text(encoding="utf-8")
          expected = "#if defined(OSD_SDL) || (defined(SDLMAME_WIN32) && !defined(RETROMAME))"
          if expected not in cpp or expected not in hdr:
              raise SystemExit("Libretro SDL exclusion was not applied correctly")

          print("FFS diagnostic instrumentation applied.")
          print("Libretro SDL input exclusion applied to input_common.cpp/.h.")
          PY

          git diff --check
          git diff -- \
            src/mame/snk/neogeo.cpp \
            src/osd/modules/input/input_common.cpp \
            src/osd/modules/input/input_common.h

      - name: Build targeted FFS diagnostic Libretro core
        shell: bash
        run: |
          export CC=x86_64-w64-mingw32-gcc-posix
          export CXX=x86_64-w64-mingw32-g++-posix
          export AR=x86_64-w64-mingw32-ar
          export CXXFLAGS="${CXXFLAGS:-} -DARRANGE_AUDIO_DIAGNOSTIC=1"

          make -f Makefile.libretro \
            platform=win \
            PTR64=1 \
            DEBUG=0 \
            MINGW64=/usr/x86_64-w64-mingw32 \
            SUBTARGET=fatfursp \
            SOURCES=src/mame/snk/neogeo.cpp \
            -j2

      - name: Collect diagnostic core
        shell: bash
        run: |
          set -e
          rm -rf arrange-audio-artifact
          mkdir -p arrange-audio-artifact

          find . -type f \( \
            -name '*_libretro.dll' -o \
            -name '*_libretro.pdb' -o \
            -name '*_libretro.dll.a' \
          \) -print -exec cp --parents {} arrange-audio-artifact/ \;

          test -n "$(find arrange-audio-artifact -type f -name '*_libretro.dll' -print -quit)"

      - name: Upload diagnostic core
        uses: actions/upload-artifact@v4
        with:
          name: arrange-audio-ffs-diagnostic-windows-x64
          path: arrange-audio-artifact/
          if-no-files-found: error
